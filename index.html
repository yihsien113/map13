<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>你畫我猜</title>
  <!-- iOS PWA 專屬設定，確保全螢幕與狀態列隱藏 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="你畫我猜">

  <!-- 引入外部注音模組 -->
  <script src="bopomofo.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
      /* 鎖定畫面，防止 iPad 畫畫時拖曳或回彈 */
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
    }

    /* 載入畫面 */
    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 999;
    }
    .spinner {
      margin-bottom: 20px;
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff4081;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 遊戲主容器 */
    #game-container {
      position: relative;
      width: 96vw;
      height: 92dvh;
      max-width: 1200px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: none;
      background-color: #1e272e;
      flex-direction: column;
    }

    /* 覆蓋層 (開始畫面 / 結算畫面) */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.80);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(15px);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      text-align: center;
    }

    .intro-copy {
      width: 100%;
      max-width: 720px;
      padding: 24px 22px;
      border-radius: 18px;
      background-color: rgba(0, 0, 0, 0.75);
      border: 2px solid rgba(255, 64, 129, 0.4);
    }

    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      background-color: #ff4081;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
      transition: transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { transform: scale(0.95); }

    #hud {
      position: absolute;
      top: 12px;
      right: 14px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 16px;
      border-radius: 15px;
      pointer-events: none;
      z-index: 100;
      display: none;
      backdrop-filter: blur(4px);
    }

    /* ========= 你畫我猜 專屬版面 ========= */
    .board-wrapper {
      flex: 1;
      position: relative;
      margin: 62px 14px 10px 14px;
      background: #ffffff;
      border-radius: 16px;
      border: 4px solid #ff4081;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    #drawCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    /* 畫布頂部狀態提示與偷看題目按鈕 */
    .phase-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      color: #ffeb3b;
      padding: 6px 20px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: bold;
      z-index: 80;
      pointer-events: none;
      white-space: nowrap;
      display: none;
    }

    #peek-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: #ff9800;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 20;
      display: none;
    }
    #peek-btn:active { transform: scale(0.95); }

    /* 抽題與展示題目彈窗 */
    #turn-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.50);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    .turn-card {
      background: #2b2727;
      border: 3px solid #ff4081;
      border-radius: 20px;
      padding: 28px 36px;
      max-width: 540px;
      width: 92%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .player-badge {
      background: #2196F3;
      color: #fff;
      padding: 6px 22px;
      border-radius: 999px;
      font-size: 38px;
      font-weight: bold;
    }
    .player-badge.p2 {
      background: #9c27b0;
    }

    .secret-word-box {
      background: #2d3436;
      border: 4px dashed #ff4081;
      border-radius: 18px;
      padding: 16px 36px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .secret-emoji {
      font-size: 68px;
      line-height: 1.1;
    }

    .secret-word-text {
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
    }

    /* 底部控制面板 */
    .bottom-bar {
      height: 220px;
      margin: 0 14px 14px 14px;
      background: #2d3436;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 畫筆工具列 */
    #draw-controls {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .palette-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px;
    }

    .color-dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.6);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .color-dot.active {
      transform: scale(1.22);
      border: 4px solid #ffeb3b;
      box-shadow: 0 0 10px rgba(255,235,59,0.8);
    }

    .tool-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-chip {
      background: #485460;
      color: #fff;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tool-chip.active {
      background: #f1f2f6;
      color: #000;
      border-color: #fff;
    }
    .tool-chip:active { transform: scale(0.95); }

    .ok-draw-btn {
      height: 125px;
      min-width: 135px;
      background: #00c853;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 30px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #009624;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .ok-draw-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #009624;
    }

    /* 六選一猜題按鈕網格 */
    #guess-controls {
      width: 100%;
      height: 100%;
      display: none;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
    }

    .guess-option-btn {
      background: #1e272e;
      color: #fff;
      border: 3px solid #ff4081;
      border-radius: 14px;
      font-size: 36px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #c51162;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1px;
      transition: transform 0.1s, background-color 0.2s;
    }
    .guess-option-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c51162;
    }
    .guess-option-btn.wrong {
      background: #636e72;
      color: #b2bec3;
      border-color: #636e72;
      box-shadow: none;
      pointer-events: none;
    }
    .guess-option-btn.correct {
      background: #60ff40;
      color: #000;
      border-color: #00c853;
      box-shadow: 0 4px 0 #009624;
    }

    #idle-hint {
      color: #dfe6e9;
      font-size: 22px;
      font-weight: bold;
    }

    /* 答對時中央浮現慶祝動畫 */
    .correct-burst {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 60;
      font-size: 56px;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 4px 16px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    @media (max-width: 768px) {
      #guess-controls {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
      .guess-option-btn { font-size: 32px; }
      .bottom-bar { height: 260px; }

      .color-dot { width: 34px; height: 34px; }
      .tool-chip { font-size: 15px; padding: 6px 10px; }
      .ok-draw-btn { min-width: 105px; font-size: 24px; }
      .phase-banner { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">雙人畫板載入中...</div>
  </div>

  <div id="game-container">
    <div class="phase-banner" id="phaseBanner">準備開始</div>
    <div id="hud">🎨 <span id="roundDisplay">1/4</span></div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="overlay" style="display: none;">
      <div class="intro-copy">
        <h1 class="zh-text" style="display: block; font-size: 60px; margin: 0 0 28px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); color: #fff;">
          <ruby>你<rt>ㄋㄧˇ</rt></ruby>
          <ruby>畫<rt>ㄏㄨㄚˋ</rt></ruby>
          <ruby>我<rt>ㄨㄛˇ</rt></ruby>
          <ruby>猜<rt>ㄘㄞ</rt></ruby>
        </h1>
        <p class="zh-text" style="display: block; font-size: 40px; margin: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.8); max-width: 100%;">
          <ruby>輪<rt>ㄌㄨㄣˊ</rt></ruby>
          <ruby>流<rt>ㄌㄧㄡˊ</rt></ruby>
          <ruby>畫<rt>ㄏㄨㄚˋ</rt></ruby>
          <ruby>畫<rt>ㄏㄨㄚˋ</rt></ruby>
          <span>，</span>
          <br>
          <ruby>互<rt>ㄏㄨˋ</rt></ruby>
          <ruby>相<rt>ㄒㄧㄤ</rt></ruby>
          <ruby>猜<rt>ㄘㄞ</rt></ruby>
          <ruby>題<rt>ㄊㄧˊ</rt></ruby>
          <span>！</span>
        </p>
      </div>

      <button class="btn zh-text" style="font-size: 32px; padding: 15px 55px; margin-top: 28px;" onclick="startGame()">
        <ruby>開<rt>ㄎㄞ</rt></ruby>
        <ruby>始<rt>ㄕˇ</rt></ruby>
      </button>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="overlay" style="display: none;">
      <div style="font-size: 80px; margin-bottom: 12px;">🎉🎨👏</div>
      <h1 class="zh-text" style="font-size: 48px; color: #ffeb3b; margin: 0 0 30px 0;">
        <ruby>過<rt>ㄍㄨㄛˋ</rt></ruby>
        <ruby>關<rt>ㄍㄨㄢ</rt></ruby>
        <ruby>成<rt>ㄔㄥˊ</rt></ruby>
        <ruby>功<rt>ㄍㄨㄥ</rt></ruby>
        <span>！</span>
      </h1>

      <div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 320px;">
        <button class="btn zh-text" style="width: 100%; font-size: 32px; padding: 16px 0; margin: 0;" onclick="startGame()">
          <ruby>再<rt>ㄗㄞˋ</rt></ruby>
          <ruby>玩<rt>ㄨㄢˊ</rt></ruby>
          <ruby>一<rt>ㄧ</rt></ruby>
          <ruby>次<rt>ㄘˋ</rt></ruby>
        </button>
      </div>
    </div>

    <!-- 中央畫布舞台 -->
    <div class="board-wrapper">
      <button type="button" id="peek-btn">
        👀 <ruby>看<rt>ㄎㄢˋ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby><ruby>目<rt>ㄇㄨˋ</rt></ruby>
      </button>

      <canvas id="drawCanvas"></canvas>

      <div class="correct-burst zh-text" id="correctBurst">
        🎉 <ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>對<rt>ㄉㄨㄟˋ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>！
      </div>
    </div>

    <!-- 抽題與展示題目彈窗 -->
    <div id="turn-modal">
      <div class="turn-card" id="turnCardContent"></div>
    </div>

    <!-- 下方工具列 -->
    <div class="bottom-bar">
      <div id="idle-hint" class="zh-text"></div>

      <div id="draw-controls">
        <div class="palette-area">
          <div class="color-row" id="colorRow"></div>
          <div class="tool-row">
            <!-- 筆刷：細 -->
            <button type="button" class="tool-chip active" data-size="6" style="width: 44px; height: 44px; padding: 0;">
              <div style="width: 6px; height: 6px; background-color: currentColor; border-radius: 50%;"></div>
            </button>
            <!-- 筆刷：中 -->
            <button type="button" class="tool-chip" data-size="14" style="width: 44px; height: 44px; padding: 0;">
              <div style="width: 14px; height: 14px; background-color: currentColor; border-radius: 50%;"></div>
            </button>
            <!-- 筆刷：粗 -->
            <button type="button" class="tool-chip" data-size="26" style="width: 44px; height: 44px; padding: 0;">
              <div style="width: 26px; height: 26px; background-color: currentColor; border-radius: 50%;"></div>
            </button>
            <!-- 復原與清除 -->
            <button type="button" class="tool-chip" id="undoBtn">
              ↩️
            </button>
            <button type="button" class="tool-chip" id="clearBtn">
              🗑️
            </button>
          </div>
        </div>

        <button type="button" class="ok-draw-btn" id="finishDrawOkBtn">
          <span>OK</span>
        </button>
      </div>

      <div id="guess-controls"></div>
    </div>
  </div>

  <script>
    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // 90 個兒童友善題庫（附注音與 Emoji）

      { word: '房子', emoji: '🏠', ruby: '<ruby>房<rt>ㄈㄤˊ</rt></ruby><ruby>子<rt>˙ㄗ</rt></ruby>' },
      { word: '汽車', emoji: '🚗', ruby: '<ruby>汽<rt>ㄑㄧˋ</rt></ruby><ruby>車<rt>ㄔㄜ</rt></ruby>' },

      { word: '蝴蝶', emoji: '🦋', ruby: '<ruby>蝴<rt>ㄏㄨˊ</rt></ruby><ruby>蝶<rt>ㄉㄧㄝˊ</rt></ruby>' },
      { word: '大樹', emoji: '🌳', ruby: '<ruby>大<rt>ㄉㄚˋ</rt></ruby><ruby>樹<rt>ㄕㄨˋ</rt></ruby>' },
      { word: '蛋糕', emoji: '🎂', ruby: '<ruby>蛋<rt>ㄉㄢˋ</rt></ruby><ruby>糕<rt>ㄍㄠ</rt></ruby>' },
      { word: '草莓', emoji: '🍓', ruby: '<ruby>草<rt>ㄘㄠˇ</rt></ruby><ruby>莓<rt>ㄇㄟˊ</rt></ruby>' },
      { word: '笑臉', emoji: '😊', ruby: '<ruby>笑<rt>ㄒㄧㄠˋ</rt></ruby><ruby>臉<rt>ㄌㄧㄢˇ</rt></ruby>' },
      { word: '香蕉', emoji: '🍌', ruby: '<ruby>香<rt>ㄒㄧㄤ</rt></ruby><ruby>蕉<rt>ㄐㄧㄠ</rt></ruby>' },
      { word: '烏龜', emoji: '🐢', ruby: '<ruby>烏<rt>ㄨ</rt></ruby><ruby>龜<rt>ㄍㄨㄟ</rt></ruby>' },
      { word: '兔子', emoji: '🐰', ruby: '<ruby>兔<rt>ㄊㄨˋ</rt></ruby><ruby>子<rt>˙ㄗ</rt></ruby>' },
      { word: '眼鏡', emoji: '👓', ruby: '<ruby>眼<rt>ㄧㄢˇ</rt></ruby><ruby>鏡<rt>ㄐㄧㄥˋ</rt></ruby>' },
      { word: '皇冠', emoji: '👑', ruby: '<ruby>皇<rt>ㄏㄨㄤˊ</rt></ruby><ruby>冠<rt>ㄍㄨㄢ</rt></ruby>' },
      { word: '蘑菇', emoji: '🍄', ruby: '<ruby>蘑<rt>ㄇㄛˊ</rt></ruby><ruby>菇<rt>ㄍㄨ</rt></ruby>' },
      { word: '飛機', emoji: '✈️', ruby: '<ruby>飛<rt>ㄈㄟ</rt></ruby><ruby>機<rt>ㄐㄧ</rt></ruby>' },

    // 音效合成器 (離線可用)
    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.07);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'correct') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.22, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.25);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function drawUniqueQuestions(count) {
      let usedWords = [];
      try {
        usedWords = JSON.parse(localStorage.getItem(USED_WORDS_STORAGE_KEY) || '[]');
        if (!Array.isArray(usedWords)) usedWords = [];
      } catch (e) {
        usedWords = [];
      }

      let available = WORD_BANK.filter(item => !usedWords.includes(item.word));
      let selected = [];

      if (available.length >= count) {
        selected = shuffle(available).slice(0, count);
        usedWords.push(...selected.map(item => item.word));
      } else {
        selected = [...available];
        const needed = count - selected.length;
        const currentWords = selected.map(item => item.word);
        const freshPool = shuffle(WORD_BANK.filter(item => !currentWords.includes(item.word)));
        const extra = freshPool.slice(0, needed);
        selected = shuffle([...selected, ...extra]);
        usedWords = extra.map(item => item.word);
      }

      try {
        localStorage.setItem(USED_WORDS_STORAGE_KEY, JSON.stringify(usedWords));
      } catch (e) {}

      return selected;
    }

    function initTools() {
      const colorRow = document.getElementById('colorRow');
      colorRow.innerHTML = '';

        const dot = document.createElement('button');

        dot.style.backgroundColor = c;

          e.preventDefault();
          playSound('click');
          brushColor = c;
          document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
          dot.classList.add('active');
        });
        colorRow.appendChild(dot);
      });

      document.querySelectorAll('.tool-chip[data-size]').forEach(btn => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          playSound('click');
          brushSize = Number(btn.dataset.size);
          document.querySelectorAll('.tool-chip[data-size]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      document.getElementById('undoBtn').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playSound('click');
        if (undoStack.length > 0) {
          const lastData = undoStack.pop();
          const img = new Image();
          img.onload = () => {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            ctx.restore();
          };
          img.src = lastData;
        }
      });

      document.getElementById('clearBtn').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playSound('click');
        saveSnapshot();
        fillCanvasWhite();
      });

      document.getElementById('finishDrawOkBtn').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playSound('click');
        startGuessPhase();
      });

      document.getElementById('peek-btn').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        playSound('click');
        showPeekModal();
      });
    }

    // preserve = true 時保留畫布內容（用於螢幕旋轉/縮放），false 時直接清空
    function resizeCanvas(preserve = true) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dpr = window.devicePixelRatio || 1;
      const prev = (preserve && canvas.width > 0) ? canvas.toDataURL() : null;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      fillCanvasWhite();

      if (prev && prev !== 'data:,') {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = prev;
      }
    }

    function fillCanvasWhite() {
      const rect = canvas.getBoundingClientRect();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, rect.width, rect.height);
    }

    function saveSnapshot() {
      if (undoStack.length >= 10) undoStack.shift();
      undoStack.push(canvas.toDataURL());
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.cancelable) e.preventDefault();
      saveSnapshot();
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = brushColor;
      ctx.lineWidth = brushSize;
      ctx.stroke();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    });

    window.addEventListener('pointerup', () => {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.closePath();
    });

    function updateHUD() {
      document.getElementById('roundDisplay').innerText = `${currentRound + 1}/${TOTAL_ROUNDS}`;
    }

    function startGame() {
      playSound('click');
      currentRound = 0;
      roundQuestions = drawUniqueQuestions(TOTAL_ROUNDS);

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('phaseBanner').style.display = 'block';

      // 傳入 false，避免把上一局最後一題的畫作還原回來
      resizeCanvas(false);
      updateHUD();
      prepareRound();
    }

    function prepareRound() {
      currentTarget = roundQuestions[currentRound];
      undoStack = [];
      fillCanvasWhite();

      // 重設畫筆為黑色
      brushColor = COLORS[0];
      document.querySelectorAll('.color-dot').forEach((d, idx) => d.classList.toggle('active', idx === 0));

      updateHUD();

      const isPlayer2 = (currentRound % 2 === 1);
      const drawerNum = isPlayer2 ? '2' : '1';
      const roundRubyNum = ROUND_RUBY_NUMS[currentRound] || (currentRound + 1);

      document.getElementById('peek-btn').style.display = 'none';
      document.getElementById('draw-controls').style.display = 'none';
      document.getElementById('guess-controls').style.display = 'none';
      document.getElementById('idle-hint').style.display = 'block';
      document.getElementById('phaseBanner').innerHTML = `第 ${currentRound + 1} 題：玩家 ${drawerNum} 準備畫畫`;

      const turnModal = document.getElementById('turn-modal');
      const card = document.getElementById('turnCardContent');
      turnModal.style.display = 'flex';

      card.innerHTML = `
        <div class="player-badge ${isPlayer2 ? 'p2' : ''} zh-text">
          🎨 <ruby>第<rt>ㄉㄧˋ</rt></ruby>${roundRubyNum}<ruby>題<rt>ㄊㄧˊ</rt></ruby>
        </div>
        <h2 class="zh-text" style="font-size: 34px; margin: 4px 0;">
          <ruby>玩<rt>ㄨㄢˊ</rt></ruby><ruby>家<rt>ㄐㄧㄚ</rt></ruby> ${drawerNum} <ruby>畫<rt>ㄏㄨㄚˋ</rt></ruby><ruby>畫<rt>ㄏㄨㄚˋ</rt></ruby>
        </h2>
        <button type="button" class="btn zh-text" style="font-size: 30px; padding: 14px 50px; margin-top: 10px;" id="drawWordStartBtn">
          <ruby>開<rt>ㄎㄞ</rt></ruby><ruby>始<rt>ㄕˇ</rt></ruby>
        </button>
      `;

      if (window.Bopomofo && typeof window.Bopomofo.render === 'function') {
        window.Bopomofo.render();
      }

      document.getElementById('drawWordStartBtn').onclick = () => {
        playSound('click');
        showSecretWordStep();
      };
    }

    function showSecretWordStep() {
      const card = document.getElementById('turnCardContent');
      card.innerHTML = `
        <h2 class="zh-text" style="font-size: 38px; margin: 0; color: #ffeb3b; padding-left: 20px;">
          <ruby>題<rt>ㄊㄧˊ</rt></ruby><ruby>目<rt>ㄇㄨˋ</rt></ruby>
        </h2>
        <div class="secret-word-box">
          <div class="secret-emoji">${currentTarget.emoji}</div>
          <div class="secret-word-text zh-text" style="padding-left: 15px;">${currentTarget.ruby}</div>
        </div>
        <button type="button" class="btn zh-text" style="font-size: 32px; padding: 14px 60px; background-color: #00c853; margin-top: 6px;" id="wordOkBtn">
          OK
        </button>
      `;

      if (window.Bopomofo && typeof window.Bopomofo.render === 'function') {
        window.Bopomofo.render();
      }

      document.getElementById('wordOkBtn').onclick = () => {
        playSound('click');
        startDrawingPhase();
      };
    }

    function showPeekModal() {
      const turnModal = document.getElementById('turn-modal');
      const card = document.getElementById('turnCardContent');
      turnModal.style.display = 'flex';
      card.innerHTML = `
        <h2 class="zh-text" style="font-size: 30px; margin: 0; color: #ffeb3b;">
          🤫 <ruby>偷<rt>ㄊㄡ</rt></ruby><ruby>看<rt>ㄎㄢˋ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby><ruby>目<rt>ㄇㄨˋ</rt></ruby>
        </h2>
        <div class="secret-word-box">
          <div class="secret-emoji">${currentTarget.emoji}</div>
          <div class="secret-word-text zh-text">${currentTarget.ruby}</div>
        </div>
        <button type="button" class="btn zh-text" style="font-size: 30px; padding: 12px 55px; background-color: #00c853;" id="closePeekOkBtn">
          OK
        </button>
      `;

      if (window.Bopomofo && typeof window.Bopomofo.render === 'function') {
        window.Bopomofo.render();
      }

      document.getElementById('closePeekOkBtn').onclick = () => {
        playSound('click');
        turnModal.style.display = 'none';
      };
    }

    function startDrawingPhase() {
      document.getElementById('turn-modal').style.display = 'none';
      document.getElementById('peek-btn').style.display = 'block';
      document.getElementById('idle-hint').style.display = 'none';
      document.getElementById('guess-controls').style.display = 'none';
      document.getElementById('draw-controls').style.display = 'flex';
      canvas.style.pointerEvents = 'auto';

      document.getElementById('phaseBanner').innerHTML = `🎨 畫好後請按右下角 OK`;
    }

    function startGuessPhase() {
      document.getElementById('peek-btn').style.display = 'none';
      document.getElementById('draw-controls').style.display = 'none';
      document.getElementById('idle-hint').style.display = 'none';
      canvas.style.pointerEvents = 'none';

      const guesserNum = (currentRound % 2 === 1) ? '1' : '2';
      document.getElementById('phaseBanner').innerHTML = `🔍 請玩家 ${guesserNum} 從下方選出正確答案！`;

      const distractors = shuffle(
        WORD_BANK.filter(item => item.word !== currentTarget.word)
      ).slice(0, 5);

      const options = shuffle([currentTarget, ...distractors]);
      const guessGrid = document.getElementById('guess-controls');
      guessGrid.innerHTML = '';
      guessGrid.style.display = 'grid';

      options.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'guess-option-btn zh-text';
        btn.innerHTML = item.ruby;

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleGuess(btn, item);
        });

        guessGrid.appendChild(btn);
      });

      if (window.Bopomofo && typeof window.Bopomofo.render === 'function') {
        window.Bopomofo.render();
      }
    }

    function handleGuess(btn, item) {
      if (item.word === currentTarget.word) {
        btn.classList.add('correct');
        playSound('correct');

        document.querySelectorAll('.guess-option-btn').forEach(b => b.style.pointerEvents = 'none');

        const correctBurst = document.getElementById('correctBurst');
        correctBurst.style.display = 'flex';

        setTimeout(() => {
          correctBurst.style.display = 'none';
          if (currentRound < TOTAL_ROUNDS - 1) {
            currentRound++;
            prepareRound();
          } else {
            endGame();
          }
        }, 900);
      } else {
        playSound('wrong');
        btn.classList.add('wrong');
      }
    }

    function endGame() {
      document.getElementById('hud').style.display = 'none';
      document.getElementById('phaseBanner').style.display = 'none';
      document.getElementById('peek-btn').style.display = 'none';
      document.getElementById('result-screen').style.display = 'flex';
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTools();
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
      document.getElementById('start-screen').style.display = 'flex';
      resizeCanvas(false);
    });

    window.addEventListener('resize', () => {
      resizeCanvas(true);
    });
  </script>
</body>
</html>
